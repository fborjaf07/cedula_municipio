name: Descarga paralela

# Una sesion de eGob por direccion, todas a la vez. eGob admite sesiones
# simultaneas con las mismas credenciales, asi que 23 jobs en paralelo
# tardan lo que la direccion mas lenta en vez de la suma de todas.
#
# Cada job reintenta su propia direccion hasta tres veces. Si una falla, solo
# esa vuelve a correr: las otras 22 no se reinician. Lo que quede pendiente se
# recupera con el workflow "Reintento de direcciones".
#
# La lista va literal a proposito: leerla de direcciones.json obligaba a un
# job previo y a fromJSON en el bloque strategy, y ahi se rompia el YAML.
on:
  # 22:00 en Ecuador (UTC-5) = 03:00 UTC del dia siguiente.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      detalle:
        description: "Bajar el detalle de movimientos"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        direccion:
          - "2026.1.1"
          - "2026.1.2"
          - "2026.1.3"
          - "2026.1.4"
          - "2026.1.5"
          - "2026.1.6"
          - "2026.1.7"
          - "2026.1.8"
          - "2026.1.9"
          - "2026.1.10"
          - "2026.2.1"
          - "2026.2.4"
          - "2026.3.1"
          - "2026.3.2"
          - "2026.3.3"
          - "2026.3.4"
          - "2026.3.5"
          - "2026.3.6"
          - "2026.3.7"
          - "2026.3.8"
          - "2026.3.9"
          - "2026.5.1"
          - "2026.5.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Descargar con reintentos
        env:
          EGOB_USUARIO: ${{ secrets.EGOB_USUARIO }}
          EGOB_CLAVE: ${{ secrets.EGOB_CLAVE }}
          EGOB_DIRECCIONES: ${{ matrix.direccion }}
          # OJO: en expresiones de Actions una cadena vacia comparada con
          # false da TRUE, asi que "inputs.detalle == false" se cumplia en la
          # corrida programada (inputs viene vacio) y el detalle no se bajaba
          # nunca. Solo se apaga si alguien lo desactiva a mano.
          DETALLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.detalle == false) && 'false' || 'true' }}
        run: |
          set -o pipefail
          mkdir -p datos/detalle capturas
          if [ "$DETALLE" = "true" ]; then
            ARGS="--por-direccion"
          else
            ARGS="--por-direccion --sin-detalle"
          fi
          for INTENTO in 1 2 3; do
            echo "=== $EGOB_DIRECCIONES intento $INTENTO de 3 ==="
            OK=0
            python 1_descargar.py $ARGS 2>&1 | tee "capturas/corrida-$INTENTO.log" && OK=1
            # eGob a veces responde sin error pero sin partidas; se valida el
            # XLS. Y si se pidio detalle, tambien tiene que haber bajado
            # detalle: antes el job salia con exito con datos/detalle vacia y
            # el consolidado se publicaba sin ventana ni serie mensual.
            HAY_PART=0; ls datos/partidas_*.xls >/dev/null 2>&1 && HAY_PART=1
            HAY_DET=0;  ls datos/detalle/*.xls  >/dev/null 2>&1 && HAY_DET=1
            [ "$DETALLE" = "true" ] || HAY_DET=1
            if [ "$HAY_PART" = "1" ] && [ "$HAY_DET" = "0" ]; then
              echo "::warning::$EGOB_DIRECCIONES bajo partidas pero no el detalle."
            fi
            if [ "$OK" = "1" ] && [ "$HAY_PART" = "1" ] && [ "$HAY_DET" = "1" ]; then
              echo "OK en el intento $INTENTO"
              cp "capturas/corrida-$INTENTO.log" capturas/corrida.log
              exit 0
            fi
            echo "Intento $INTENTO sin XLS utilizable."
            rm -f datos/partidas_*.xls datos/detalle/*.xls 2>/dev/null || true
            if [ "$INTENTO" -lt 3 ]; then
              ESPERA=$((INTENTO * 90))
              echo "Esperando $ESPERA s antes del siguiente intento."
              sleep "$ESPERA"
            fi
          done
          cp capturas/corrida-3.log capturas/corrida.log 2>/dev/null || true
          echo "Los tres intentos fallaron para $EGOB_DIRECCIONES"
          exit 1

      - name: Nombre de artefacto
        if: always()
        id: n
        env:
          COD: ${{ matrix.direccion }}
        run: |
          SLUG=$(echo "$COD" | tr "." "_")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Guardar los XLS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xls-${{ steps.n.outputs.slug }}
          path: datos
          retention-days: 30
          if-no-files-found: warn

      - name: Guardar capturas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ steps.n.outputs.slug }}
          path: capturas
          retention-days: 14

  consolidar:
    needs: descargar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas openpyxl xlrd

      - name: Reunir los XLS de todas las direcciones
        uses: actions/download-artifact@v4
        with:
          pattern: xls-*
          merge-multiple: true
          path: datos

      - name: Inventario y faltantes
        id: inv
        run: |
          N=$(ls -1 datos/partidas_*.xls 2>/dev/null | wc -l | tr -d " ")
          D=$(ls -1 datos/detalle/*.xls 2>/dev/null | wc -l | tr -d " ")
          echo "partidas=$N detalle=$D"
          ls -1 datos/partidas_*.xls 2>/dev/null | sort || true
          python faltantes.py datos > faltantes.txt
          FALTAN=$(tr -d "\n" < faltantes.txt)
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "d=$D" >> "$GITHUB_OUTPUT"
          echo "faltan=$FALTAN" >> "$GITHUB_OUTPUT"
          if [ "$D" = "0" ]; then
            echo "::error::No llego ningun XLS de detalle: el consolidado saldria sin ventana ni serie mensual."
          fi
          if [ -n "$FALTAN" ]; then
            echo "::warning::Faltan direcciones: $FALTAN"
          fi

      - name: Convertir y verificar el cuadre
        id: conv
        run: |
          set -o pipefail
          # 3_convertir.py sale con codigo 2 si el codificado no cuadra; en ese
          # caso escribe datos-municipio.rechazado.json y no toca el bueno.
          python 3_convertir.py --datos datos --salida datos-municipio.json | tee conversion.log
          echo "cuadre=ok" >> "$GITHUB_OUTPUT"

      - name: Guardar el consolidado rechazado
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rechazado
          path: |
            datos-municipio.rechazado.json
            conversion.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Resumen
        if: always()
        env:
          N_OK: ${{ steps.inv.outputs.n }}
          N_DET: ${{ steps.inv.outputs.d }}
          FALTAN: ${{ steps.inv.outputs.faltan }}
        run: |
          {
            echo "## Consolidado"
            echo ""
            echo "Direcciones descargadas: $N_OK de 23"
            echo ""
            echo "Archivos de detalle: $N_DET"
            if [ "$N_DET" = "0" ]; then
              echo ""
              echo "**Sin detalle.** El tablero queda sin la ventana legal ni la"
              echo "serie mensual. Vuelva a lanzar con *Bajar el detalle* activo."
            fi
            if [ -n "$FALTAN" ]; then
              echo ""
              echo "**Faltan:** $FALTAN"
              echo ""
              echo "Corra el workflow *Reintento de direcciones* con esa lista"
              echo "en el campo direcciones: baja solo esas y reconsolida con"
              echo "los XLS que ya se guardaron."
            fi
            echo ""
            sed "s/^/    /" conversion.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el consolidado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datos-municipio
          path: |
            datos
            datos-municipio.json
          retention-days: 30
          overwrite: true

      - name: Armar los datos del tablero
        run: |
          set -o pipefail
          python 4_tablero.py --entrada datos-municipio.json --salida datos-regla.json | tee -a conversion.log

      - name: Publicar
        # Dos condiciones: bastantes direcciones y cuadre del codificado.
        if: ${{ fromJSON(steps.inv.outputs.n) >= 20 && steps.conv.outputs.cuadre == 'ok' }}
        run: |
          set -e
          # Los JSON los reescribe cada corrida, asi que fusionarlos con los del
          # repo solo produce conflictos. Se guardan aparte, se lleva el arbol a
          # origin/main de forma limpia y se comitean encima.
          cp datos-municipio.json /tmp/
          cp datos-regla.json /tmp/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # reset --hard en lugar de checkout -B: los JSON generados son
          # archivos versionados y un checkout normal se niega a sobrescribirlos.
          git reset --hard origin/main
          git checkout -B main
          cp /tmp/datos-municipio.json datos-municipio.json
          cp /tmp/datos-regla.json datos-regla.json
          git add datos-municipio.json datos-regla.json
          git diff --staged --quiet || git commit -m "Cedulas municipales con detalle"
          git push origin main
