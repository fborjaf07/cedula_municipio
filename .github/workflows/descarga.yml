name: Descarga por direccion

# Manual a proposito. Mientras las 23 direcciones no bajen limpias, un cron
# solo acumula corridas fallidas y castiga a eGob sin que nadie lo revise.
on:
  workflow_dispatch:
    inputs:
      direcciones:
        description: 'Codigos a bajar, separados por coma (vacio = las 23). Ej: 3.6,3.2'
        type: string
        default: ''
      detalle:
        description: 'Bajar tambien el detalle de movimientos (lento)'
        type: boolean
        default: false
      ver_navegador:
        description: 'No usar: en el runner no hay pantalla'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: egob-municipio
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    # Las 23 direcciones son secuenciales y cada una recarga la consulta.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Heredar lo ya descargado
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: datos-municipio
          path: datos

      - name: Preparar carpetas
        run: |
          mkdir -p datos/detalle capturas
          echo "xls heredados:     $(ls -1 datos/*.xls 2>/dev/null | wc -l)"
          echo "detalle heredado:  $(ls -1 datos/detalle/*.xls 2>/dev/null | wc -l)"

      - name: Descargar desde eGob
        env:
          EGOB_USUARIO: ${{ secrets.EGOB_USUARIO }}
          EGOB_CLAVE: ${{ secrets.EGOB_CLAVE }}
          # Si se piden direcciones concretas, se pasan por el entorno y el
          # script ignora direcciones.json.
          EGOB_DIRECCIONES: ${{ inputs.direcciones }}
        run: |
          set -o pipefail
          ARGS="--por-direccion"
          if [ "${{ inputs.detalle }}" = "true" ]; then
            ARGS="$ARGS --lote"
          else
            ARGS="$ARGS --sin-detalle"
          fi
          echo "python 1_descargar.py $ARGS"
          python 1_descargar.py $ARGS 2>&1 | tee capturas/corrida.log

      - name: Resumen del cuadre
        if: always()
        run: |
          echo '## Cuadre contra el POA' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'NO CUADRA|cuadran con|asignacion inicial descargada|Descargadas|pendiente' \
            capturas/corrida.log >> $GITHUB_STEP_SUMMARY || echo 'sin lineas de cuadre' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Guardar los XLS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datos-municipio
          path: |
            datos/**/*.xls
            datos/*.json
          retention-days: 30
          overwrite: true

      - name: Guardar capturas y log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ github.run_number }}
          path: capturas/
          retention-days: 14
