name: Convertir XLS a JSON

# No vuelve a eGob: toma los XLS que ya bajo una corrida anterior desde su
# artefacto, los lee con los mismos lectores y comitea el JSON al repo.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Id del run a convertir (vacio = busca solo el ultimo artefacto datos-municipio)'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  convertir:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pandas openpyxl xlrd

      # El id que pide download-artifact es el numero largo de la URL del run,
      # no el "#7" de la lista. Para no tener que buscarlo a mano, se consulta
      # la API por el artefacto mas reciente que se llame datos-municipio.
      - name: Localizar el artefacto
        id: buscar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "run_id=${{ inputs.run_id }}" >> $GITHUB_OUTPUT
            echo "usando el run indicado: ${{ inputs.run_id }}"
            exit 0
          fi
          RUN=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name == "datos-municipio" and .expired == false)]
                      | sort_by(.created_at) | reverse | .[0].workflow_run.id')
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "No hay ningun artefacto datos-municipio vigente." >&2
            gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | "\(.name)  run \(.workflow_run.id)  \(.created_at)  expirado=\(.expired)"' >&2
            exit 1
          fi
          echo "run_id=$RUN" >> $GITHUB_OUTPUT
          echo "artefacto mas reciente en el run $RUN"

      - name: Traer los XLS del artefacto
        uses: actions/download-artifact@v4
        with:
          name: datos-municipio
          path: datos
          run-id: ${{ steps.buscar.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inventario
        run: |
          find datos -name '*.xls' | sort
          echo "total: $(find datos -name '*.xls' | wc -l)"

      - name: Convertir a JSON
        run: |
          set -o pipefail
          python 3_convertir.py --datos datos --salida datos-municipio.json | tee conversion.log

      - name: Resumen
        if: always()
        run: |
          echo '## Direcciones convertidas' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat conversion.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Armar los datos del tablero
        run: |
          set -o pipefail
          python 4_tablero.py --entrada datos-municipio.json --salida datos-regla.json | tee -a conversion.log

      - name: Publicar
        run: |
          set -e
          # El JSON lo reescribe cada corrida completa, asi que fusionarlo con
          # el del repo solo produce conflictos. Se guarda aparte, se vuelve a
          # main limpio y se comitea encima.
          cp datos-municipio.json /tmp/
          cp datos-regla.json /tmp/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/datos-municipio.json datos-municipio.json
          cp /tmp/datos-regla.json datos-regla.json
          git add datos-municipio.json datos-regla.json
          git diff --staged --quiet || git commit -m "Cedulas municipales con detalle"
          git push origin main
