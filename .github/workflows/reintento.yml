name: Reintento de direcciones

# Recupera solo las direcciones que fallaron, sin repetir las que si bajaron.
#
# En el campo "direcciones" se pega la lista que reporto el resumen de la
# corrida anterior, separada por comas o espacios. El workflow baja unicamente
# esas, reune sus XLS con los que ya estan guardados en los artefactos de la
# corrida original y vuelve a consolidar y publicar.

on:
  workflow_dispatch:
    inputs:
      direcciones:
        description: "Direcciones a reintentar, separadas por coma (2026.3.6,2026.1.2)"
        required: true
      detalle:
        description: "Bajar el detalle de movimientos"
        type: boolean
        default: true
      corrida_previa:
        description: "Numero de la corrida de Descarga paralela cuyos XLS se reutilizan (vacio = la ultima)"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.p.outputs.lista }}
      run_id: ${{ steps.p.outputs.run_id }}
    steps:
      - name: Armar la matriz
        id: p
        env:
          ENTRADA: ${{ inputs.direcciones }}
        run: |
          LISTA=$(python - <<'PY'
          import json, os, re
          bruto = os.environ["ENTRADA"]
          cods = [c for c in re.split(r"[,\s;]+", bruto.strip()) if c]
          print(json.dumps(cods))
          PY
          )
          echo "lista=$LISTA" >> "$GITHUB_OUTPUT"
          echo "Reintentando: $LISTA"

      - name: Resolver la corrida previa
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          PEDIDA: ${{ inputs.corrida_previa }}
        run: |
          if [ -n "$PEDIDA" ]; then
            echo "run_id=$PEDIDA" >> "$GITHUB_OUTPUT"
          else
            ID=$(gh run list --workflow "Descarga paralela" --limit 1 \
                   --json databaseId --jq ".[0].databaseId" \
                   --repo "$GITHUB_REPOSITORY")
            echo "Ultima corrida de Descarga paralela: $ID"
            echo "run_id=$ID" >> "$GITHUB_OUTPUT"
          fi

  descargar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        direccion: ${{ fromJSON(needs.preparar.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Descargar con reintentos
        env:
          EGOB_USUARIO: ${{ secrets.EGOB_USUARIO }}
          EGOB_CLAVE: ${{ secrets.EGOB_CLAVE }}
          EGOB_DIRECCIONES: ${{ matrix.direccion }}
          DETALLE: ${{ inputs.detalle == false && 'false' || 'true' }}
        run: |
          set -o pipefail
          mkdir -p datos/detalle capturas
          if [ "$DETALLE" = "true" ]; then
            ARGS="--por-direccion"
          else
            ARGS="--por-direccion --sin-detalle"
          fi
          # Mas intentos y esperas mas largas que en la corrida masiva: aqui
          # ya se sabe que esta direccion es la problematica.
          for INTENTO in 1 2 3 4; do
            echo "=== $EGOB_DIRECCIONES intento $INTENTO de 4 ==="
            OK=0
            python 1_descargar.py $ARGS 2>&1 | tee "capturas/corrida-$INTENTO.log" && OK=1
            if [ "$OK" = "1" ] && ls datos/partidas_*.xls >/dev/null 2>&1; then
              echo "OK en el intento $INTENTO"
              cp "capturas/corrida-$INTENTO.log" capturas/corrida.log
              exit 0
            fi
            echo "Intento $INTENTO sin XLS utilizable."
            rm -f datos/partidas_*.xls datos/detalle/*.xls 2>/dev/null || true
            if [ "$INTENTO" -lt 4 ]; then
              ESPERA=$((INTENTO * 120))
              echo "Esperando $ESPERA s."
              sleep "$ESPERA"
            fi
          done
          cp capturas/corrida-4.log capturas/corrida.log 2>/dev/null || true
          exit 1

      - name: Nombre de artefacto
        if: always()
        id: n
        env:
          COD: ${{ matrix.direccion }}
        run: |
          SLUG=$(echo "$COD" | tr "." "_")
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Guardar los XLS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xls-${{ steps.n.outputs.slug }}
          path: datos
          retention-days: 30
          if-no-files-found: warn

      - name: Guardar capturas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ steps.n.outputs.slug }}
          path: capturas
          retention-days: 14

  consolidar:
    needs: [preparar, descargar]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas openpyxl xlrd

      - name: XLS de la corrida previa
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: xls-*
          merge-multiple: true
          path: datos
          run-id: ${{ needs.preparar.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: XLS reintentados, encima de los anteriores
        uses: actions/download-artifact@v4
        with:
          pattern: xls-*
          merge-multiple: true
          path: datos

      - name: Inventario y faltantes
        id: inv
        run: |
          N=$(ls -1 datos/partidas_*.xls 2>/dev/null | wc -l | tr -d " ")
          D=$(ls -1 datos/detalle/*.xls 2>/dev/null | wc -l | tr -d " ")
          echo "partidas=$N detalle=$D"
          python faltantes.py datos > faltantes.txt
          FALTAN=$(tr -d "\n" < faltantes.txt)
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "faltan=$FALTAN" >> "$GITHUB_OUTPUT"
          if [ -n "$FALTAN" ]; then
            echo "::warning::Siguen faltando: $FALTAN"
          fi

      - name: Convertir y verificar el cuadre
        id: conv
        run: |
          set -o pipefail
          # 3_convertir.py sale con codigo 2 si el codificado no cuadra; en ese
          # caso escribe datos-municipio.rechazado.json y no toca el bueno.
          python 3_convertir.py --datos datos --salida datos-municipio.json | tee conversion.log
          echo "cuadre=ok" >> "$GITHUB_OUTPUT"

      - name: Guardar el consolidado rechazado
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rechazado
          path: |
            datos-municipio.rechazado.json
            conversion.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Resumen
        if: always()
        env:
          N_OK: ${{ steps.inv.outputs.n }}
          FALTAN: ${{ steps.inv.outputs.faltan }}
          PREVIA: ${{ needs.preparar.outputs.run_id }}
        run: |
          {
            echo "## Reintento"
            echo ""
            echo "Reutilizando los XLS de la corrida $PREVIA."
            echo ""
            echo "Direcciones completas: $N_OK de 23"
            if [ -n "$FALTAN" ]; then
              echo ""
              echo "**Siguen faltando:** $FALTAN"
            fi
            echo ""
            sed "s/^/    /" conversion.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el consolidado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datos-municipio
          path: |
            datos
            datos-municipio.json
          retention-days: 30
          overwrite: true

      - name: Armar los datos del tablero
        run: |
          set -o pipefail
          python 4_tablero.py --entrada datos-municipio.json --salida datos-regla.json | tee -a conversion.log

      - name: Publicar
        # Dos condiciones: bastantes direcciones y cuadre del codificado.
        if: ${{ fromJSON(steps.inv.outputs.n) >= 20 && steps.conv.outputs.cuadre == 'ok' }}
        run: |
          set -e
          cp datos-municipio.json /tmp/
          cp datos-regla.json /tmp/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # reset --hard en lugar de checkout -B: los JSON generados son
          # archivos versionados y un checkout normal se niega a sobrescribirlos.
          git reset --hard origin/main
          git checkout -B main
          cp /tmp/datos-municipio.json datos-municipio.json
          cp /tmp/datos-regla.json datos-regla.json
          git add datos-municipio.json datos-regla.json
          git diff --staged --quiet || git commit -m "Cedulas municipales, reintento de direcciones"
          git push origin main
